name: Gradle Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - run: ./gradlew clean app:assembleRelease

    - name: Extract Version Code
      run: |
        echo "VERSION_CODE=$(grep -Eo 'versionCode\s+[0-9]+' app/build.gradle | grep -Eo '[0-9]+')" >> $GITHUB_ENV
        echo "APP_ID=$(awk '/applicationId/ {gsub(/"/, "", $2); print $2; exit}' app/build.gradle)" >> $GITHUB_ENV
        echo "Version code is: $VERSION_CODE"

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk.apk
        path: ./app/build/outputs/apk/release/${{ env.APP_ID }}-${{ env.VERSION_CODE }}-release.apk
